<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Looks Studio — For the look</title>
  <meta name="description" content="Looks Studio — prémiové mikiny navržené v Praze.">
  <meta name="theme-color" content="#111111">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Hanken+Grotesk:wght@400;500;600&family=Pinyon+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="wrap header__inner">
      <nav class="nav" aria-label="Hlavní navigace">
        <a href="#/" data-scroll="shop">Kolekce</a>
        <a href="#/" data-scroll="lookbook">Lookbook</a>
        <a href="#/" data-scroll="about">Studio</a>
      </nav>
      <a href="#/" class="logo" aria-label="Looks Studio — domů">Looks Studio</a>
      <button class="cart-btn" type="button" data-open-cart aria-label="Otevřít košík">
        <span class="cart-btn__label">Košík</span>
        <span class="cart-btn__count is-empty" data-cart-count>0</span>
      </button>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer class="footer">
    <div class="wrap footer__inner">
      <div class="footer__brand">
        <div class="footer__logo">Looks Studio</div>
        <p class="caps">For the look</p>
      </div>
      <div class="footer__cols">
        <div>
          <h3 class="eyebrow">Nákup</h3>
          <a href="#/info/doprava">Doprava a platba</a>
          <a href="#/info/vraceni">Vrácení zboží</a>
          <a href="#/info/velikosti">Velikosti</a>
        </div>
        <div>
          <h3 class="eyebrow">Studio</h3>
          <a href="#/" data-scroll="about">O nás</a>
          <a href="#/" data-scroll="lookbook">Lookbook</a>
        </div>
      </div>
    </div>
    <div class="wrap footer__bottom">
      <span>© 2026 Looks Studio · Praha</span>
      <span>Prototyp — objednávky se neodesílají</span>
    </div>
  </footer>

  <div class="drawer" data-drawer hidden>
    <button class="drawer__backdrop" type="button" data-close-cart aria-label="Zavřít košík"></button>
    <aside class="drawer__panel" aria-label="Košík">
      <div class="drawer__head">
        <h2>Košík <span data-cart-count-text></span></h2>
        <button class="icon-btn" type="button" data-close-cart aria-label="Zavřít košík">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="drawer__body" data-cart-body></div>
      <div class="drawer__foot" data-cart-foot></div>
    </aside>
  </div>

  <div class="toast" data-toast role="status" aria-live="polite" hidden></div>

  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
